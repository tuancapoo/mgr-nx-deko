# Metal Gear Rising-specific analysis corrections for the code generator.
#
# Empty on purpose: every entry needs its evidence (which tool or which log found it). The first translation runs with
# automatic function discovery only. Then sweep for what it missed (docs/porting-guide.md, 3.2):
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_fixpoint.py, pointer_audit.py  code pointers stored in data (vtables, callback tables, CRT tables)
#   tools/switch_check.py                       truncated jump tables
#   setjmp_address / longjmp_address            look for the CRT pair by shape (stores of r1/r31/r14-r31 into r3's buffer)

