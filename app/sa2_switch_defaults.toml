# Sonic Adventure 2 for the Switch: the fixed settings, compiled into the NRO (app/CMakeLists.txt,
# src/sa2_app.h BuiltInConfig) and applied before the SD card's sa2.toml, which holds the player's options
# (app/sa2_switch.toml) and may still override any key here for testing. docs/enhancements.md explains each key.
# Logging and profiling are off: no logs/ folder and no profile on the SD card.

# Game and paths
license_mask = 1
sa2_renderer_native = true
sa2_render_height_handheld = 720
sa2_render_height_docked = 1080
sa2_shader_misses = ""
asset_pack = true
asset_pack_build = true

# No logging, no profiling
log_level = "off"
log_to_file = false
switch_profile_stacks = false
switch_profile_report = false
sa2_gpu_marks_categories = false

# CPU enhancements (docs/enhancements.md)
sa2_cpu_enhancements = true
sa2_cpu_gpu_wait_sleep = true
sa2_gpu_wait_max_us = 1000
